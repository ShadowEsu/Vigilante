name: Security audit

on:
  push:
    branches: [Vigilante, YC_Vigilante-Website]
  pull_request:
    branches: [Vigilante, YC_Vigilante-Website]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high severity and above)
        run: npm audit --audit-level=high

      - name: Check for committed secrets patterns
        run: |
          ! git grep -E 'SUPABASE_SERVICE_ROLE|sk-ant-|BEGIN (RSA |OPENSSH )PRIVATE' -- ':!package-lock.json' ':!*.md' || \
            (echo "Possible secret found in tracked files" && exit 1)
