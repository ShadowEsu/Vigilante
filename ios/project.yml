name: Vigil
options:
  bundleIdPrefix: com.vigil
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  Vigil:
    type: application
    platform: iOS
    sources:
      - Vigil
    info:
      path: Vigil/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.vigil.app
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.10"
    dependencies:
      - package: Supabase
        product: Supabase
